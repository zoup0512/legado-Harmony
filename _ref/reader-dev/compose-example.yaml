# =====================================================================
# reader-dev Docker Compose 示例
#
# ⚠️ 使用前必改（搜索「必改」）：
#   1. READER_APP_SECUREKEY  —— 管理密码，**必须改成你自己的强密码**
#   2. READER_APP_SECURE     —— 建议开启登录鉴权（多用户/公网部署必须开）
#   3. 时区 / 端口映射按需调整
#
# 启动：docker compose up -d
# 日志：docker compose logs -f reader-dev
# 升级：docker compose pull && docker compose up -d
# =====================================================================

services:
  reader-dev:
    # GHCR 镜像（多架构 amd64/arm64）；Docker Hub 同名镜像亦可：${DH_USER}/reader-dev
    image: ghcr.io/warpdotsys/reader-dev:latest
    container_name: reader-dev
    restart: unless-stopped

    # ---- 端口映射（宿主端口:容器端口；容器内固定 8080）----
    # 必改建议：不要把默认 8080 直接暴露公网，按需改宿主侧端口并配合反代/防火墙
    ports:
      - "8080:8080"

    environment:
      # ============ 必改项 ============
      # 登录鉴权开关：secure=1 后访问需账号密码（首个注册用户为管理员）
      READER_APP_SECURE: "true"
      # 管理密码（secure 模式下注册/管理所需）——务必替换为强密码！
      READER_APP_SECUREKEY: "CHANGE_ME_STRONG_PASSWORD"

      # ============ 按需调整 ============
      # 容器内监听端口（与 legacy 变量同名 READER_SERVER_PORT；一般不动，只改 ports 左侧）
      READER_SERVER_PORT: "8080"
      # 容器内数据目录（与下方 volumes 对应——一般不动）
      # 注：旧 legacy 容器常为 WORKDIR=/ + 挂 /data；本镜像显式声明 /data 更直观
      READER_APP_WORKDIR: /data

      # ---- legacy env 兼容性说明 ----
      # READER_APP_CACHECHAPTERCONTENT（默认 true）已支持：false 时阅读不落正文缓存
      # READER_APP_REMOTEWEBVIEWAPI 未移植：webView 抓取由内置 camoufox 承担，
      #   设置该变量仅产生启动日志提示，不会连接 remote-webview 服务
      # SPRING_PROFILES_ACTIVE / JAVA_OPTS 为 Java 专属，Rust 版自动忽略

      # 用户上限 / 单用户书架上限（大库可调高）
      READER_APP_USERLIMIT: "100"
      READER_APP_USERBOOKLIMIT: "50000"

      # 默认用户能力开关（secure 模式新用户初始权限）
      READER_APP_DEFAULTUSERENABLEWEBDAV: "true"
      READER_APP_DEFAULTUSERENABLELOCALSTORE: "true"
      READER_APP_DEFAULTUSERENABLEBOOKSOURCE: "true"
      READER_APP_DEFAULTUSERENABLERSSSOURCE: "true"

      # 时区（阅读进度统计按本地时区归天）
      TZ: Asia/Shanghai

      # 日志落盘（可选）：设置后启用「控制台+文件」双写，文件按大小轮转
      # READER_LOG_DIR: /data/logs
      # READER_LOG_MAX_SIZE_MB: "10"
      # READER_LOG_MAX_FILES: "7"

    volumes:
      # 数据持久化：SQLite(reader.db) + 章节/封面缓存 + 本地书仓 + WebDAV 缓存
      # 必改建议：左侧换成宿主机明确路径（如 ./data:/data），便于备份迁移
      - ./data:/data

    healthcheck:
      # 就绪探测：HTTP 200 即健康
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # 资源限制示例（按机器规格调整或删除）
    deploy:
      resources:
        limits:
          memory: 1g

# =====================================================================
# 从旧 legacy 容器（openjdk 镜像）无缝升级
#   - Entrypoint/Command：新镜像自带 tini + reader-dev——删除旧 compose 里
#     的 command: java -jar /app/bin/reader.jar 即可
#   - 数据：旧容器 READER_APP_WORKDIR=/ 时数据位于容器 /storage；
#     挂载同一宿主目录（如 -v /your/host/storage:/storage）并保持
#     READER_APP_WORKDIR: "/"，首次启动自动执行 JSON→SQLite 迁移
#     （迁移前自动备份原始 JSON 到 storage/backup-before-migrate-*）
#
# 常用操作
#   首次启动后浏览器访问 http://<host>:8080 注册管理员账号
#   备份：停容器后直接打包数据目录即可（单 SQLite 文件 + 缓存）
# =====================================================================
